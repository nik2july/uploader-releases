<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2A0B0E"/>
      <stop offset="45%" stop-color="#141110"/>
      <stop offset="100%" stop-color="#080706"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4B942"/>
      <stop offset="50%" stop-color="#E8A317"/>
      <stop offset="100%" stop-color="#9C6B0B"/>
    </linearGradient>

    <!-- Sindoor Red Gradient -->
    <linearGradient id="sindoorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C22E33"/>
      <stop offset="60%" stop-color="#9B2226"/>
      <stop offset="100%" stop-color="#6B1316"/>
    </linearGradient>

    <!-- Clapper Stripe Pattern -->
    <pattern id="clapperStripes" width="48" height="48" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="48" stroke="#E8A317" stroke-width="24" />
      <line x1="24" y1="0" x2="24" y2="48" stroke="#1A1814" stroke-width="24" />
    </pattern>

    <!-- Clip Path for Rounded macOS Squircle -->
    <clipPath id="squircleClip">
      <rect x="32" y="32" width="960" height="960" rx="220" ry="220"/>
    </clipPath>

    <!-- Drop Shadows -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#E8A317" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Shadow & Base Background -->
  <g filter="url(#glowShadow)">
    <rect x="32" y="32" width="960" height="960" rx="220" ry="220" fill="url(#bgGrad)"/>
    <!-- Subtle Inner Border Highlight -->
    <rect x="32" y="32" width="960" height="960" rx="220" ry="220" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6"/>
  </g>

  <!-- Inner Clip Region -->
  <g clip-path="url(#squircleClip)">
    <!-- Ambient Vignette Ring -->
    <circle cx="512" cy="460" r="420" fill="#E8A317" opacity="0.04"/>

    <!-- Cinema Film Clapperboard Slate Top Bar -->
    <g transform="translate(180, 110)">
      <!-- Slate Board Bar -->
      <rect x="0" y="0" width="664" height="64" rx="14" fill="#1A1814" stroke="url(#goldGrad)" stroke-width="2.5"/>
      <!-- Striped Infill -->
      <rect x="6" y="6" width="652" height="52" rx="10" fill="url(#clapperStripes)"/>
      <!-- Slate Pivot Pin Left -->
      <circle cx="36" cy="32" r="9" fill="#0D0C0A" stroke="#E8A317" stroke-width="2.5"/>
      <!-- Slate Clip Icon Right -->
      <circle cx="628" cy="32" r="9" fill="#0D0C0A" stroke="#E8A317" stroke-width="2.5"/>
    </g>

    <!-- Left & Right Film Strip Perforations Motif -->
    <g fill="#E8A317" opacity="0.25">
      <!-- Left Sprocket Holes -->
      <rect x="90" y="240" width="28" height="42" rx="6"/>
      <rect x="90" y="320" width="28" height="42" rx="6"/>
      <rect x="90" y="400" width="28" height="42" rx="6"/>
      <rect x="90" y="480" width="28" height="42" rx="6"/>
      <rect x="90" y="560" width="28" height="42" rx="6"/>
      <rect x="90" y="640" width="28" height="42" rx="6"/>
      <!-- Right Sprocket Holes -->
      <rect x="906" y="240" width="28" height="42" rx="6"/>
      <rect x="906" y="320" width="28" height="42" rx="6"/>
      <rect x="906" y="400" width="28" height="42" rx="6"/>
      <rect x="906" y="480" width="28" height="42" rx="6"/>
      <rect x="906" y="560" width="28" height="42" rx="6"/>
      <rect x="906" y="640" width="28" height="42" rx="6"/>
    </g>

    <!-- Central Baawaray Monogram Artwork -->
    <!-- Scaled and centered to fit beautifully inside the film frame (scale ~0.50, centered at 512, 470) -->
    <g transform="translate(230, 215) scale(0.50)" filter="url(#goldGlow)">
      <!-- Outer gold silhouette accent -->
      <path fill="#E8A317" opacity="0.4" transform="translate(4, 6)" d="M 97.730469 189.175781 L 486.367188 189.175781 C 505.332031 189.175781 523.425781 191.800781 540.652344 197.039062 C 557.875 202.285156 571.855469 210.898438 582.585938 222.875 C 593.308594 234.863281 598.675781 251.085938 598.675781 271.546875 C 598.675781 296.511719 592.183594 317.476562 579.214844 334.457031 C 566.238281 351.425781 549.640625 365.644531 529.421875 377.117188 C 509.199219 388.601562 487.601562 398.082031 464.628906 405.570312 C 441.671875 413.058594 420.085938 419.675781 399.867188 425.421875 C 379.644531 431.15625 363.042969 436.894531 350.070312 442.640625 C 337.09375 448.386719 330.609375 455.011719 330.609375 462.496094 C 330.609375 474.480469 336.226562 484.464844 347.460938 492.460938 C 358.691406 500.441406 373.664062 507.679688 392.367188 514.171875 C 411.085938 520.648438 431.554688 527.515625 453.761719 534.757812 C 475.980469 541.988281 498.199219 550.972656 520.40625 561.71875 C 542.625 572.449219 563.101562 585.929688 581.828125 602.160156 C 600.546875 618.375 615.527344 638.707031 626.761719 663.160156 C 637.996094 687.613281 643.613281 717.316406 643.613281 752.273438 C 643.613281 779.234375 637.996094 804.074219 626.761719 826.78125 C 615.527344 849.496094 600.296875 869.089844 581.070312 885.5625 C 561.855469 902.042969 539.894531 914.894531 515.183594 924.125 C 490.46875 933.359375 464.636719 937.96875 437.695312 937.96875 L 97.730469 937.96875 Z" />

      <!-- Primary Sindoor Red Monogram Path -->
      <path fill="url(#sindoorGrad)" d="M 97.730469 189.175781 L 486.367188 189.175781 C 505.332031 189.175781 523.425781 191.800781 540.652344 197.039062 C 557.875 202.285156 571.855469 210.898438 582.585938 222.875 C 593.308594 234.863281 598.675781 251.085938 598.675781 271.546875 C 598.675781 296.511719 592.183594 317.476562 579.214844 334.457031 C 566.238281 351.425781 549.640625 365.644531 529.421875 377.117188 C 509.199219 388.601562 487.601562 398.082031 464.628906 405.570312 C 441.671875 413.058594 420.085938 419.675781 399.867188 425.421875 C 379.644531 431.15625 363.042969 436.894531 350.070312 442.640625 C 337.09375 448.386719 330.609375 455.011719 330.609375 462.496094 C 330.609375 474.480469 336.226562 484.464844 347.460938 492.460938 C 358.691406 500.441406 373.664062 507.679688 392.367188 514.171875 C 411.085938 520.648438 431.554688 527.515625 453.761719 534.757812 C 475.980469 541.988281 498.199219 550.972656 520.40625 561.71875 C 542.625 572.449219 563.101562 585.929688 581.828125 602.160156 C 600.546875 618.375 615.527344 638.707031 626.761719 663.160156 C 637.996094 687.613281 643.613281 717.316406 643.613281 752.273438 C 643.613281 779.234375 637.996094 804.074219 626.761719 826.78125 C 615.527344 849.496094 600.296875 869.089844 581.070312 885.5625 C 561.855469 902.042969 539.894531 914.894531 515.183594 924.125 C 490.46875 933.359375 464.636719 937.96875 437.695312 937.96875 L 97.730469 937.96875 Z M 206.304688 833.128906 L 480.355469 833.128906 C 509.316406 833.128906 535.277344 830.386719 558.234375 824.902344 C 581.207031 819.414062 599.304688 810.1875 612.523438 797.207031 C 625.757812 784.21875 632.378906 766.996094 632.378906 745.535156 C 632.378906 724.566406 625.507812 707.59375 611.765625 694.617188 C 598.039062 681.644531 579.945312 671.410156 557.476562 663.917969 C 535.023438 656.433594 510.324219 650.066406 483.363281 644.820312 C 456.402344 639.582031 429.316406 634.097656 402.113281 628.363281 C 374.902344 622.613281 350.070312 615.503906 327.605469 607.019531 C 305.148438 598.519531 287.058594 587.289062 273.316406 573.316406 C 259.589844 559.332031 252.730469 540.863281 252.730469 517.90625 C 252.730469 501.917969 258.347656 488.5625 269.582031 477.832031 C 280.816406 467.105469 295.417969 457.621094 313.390625 449.378906 C 331.367188 441.144531 350.210938 432.785156 369.925781 424.300781 C 389.636719 415.824219 408.488281 405.84375 426.460938 394.359375 C 444.433594 382.867188 459.027344 368.386719 470.246094 350.914062 C 481.480469 333.449219 487.097656 311.726562 487.097656 285.757812 C 487.097656 262.300781 480.476562 244.457031 467.242188 232.230469 C 454.023438 220.003906 436.054688 211.644531 413.347656 207.148438 C 390.632812 202.65625 365.304688 200.410156 337.347656 200.410156 L 206.304688 200.410156 Z" />
    </g>

    <!-- Bottom Luxury Branding Banner "BAAWARAY CLIPS" -->
    <g transform="translate(212, 750)">
      <!-- Banner Background Pill -->
      <rect x="0" y="0" width="600" height="92" rx="46" fill="#141110" stroke="url(#goldGrad)" stroke-width="2.5"/>

      <!-- Golden Film Reel Accent Dots -->
      <circle cx="50" cy="46" r="10" fill="#E8A317"/>
      <circle cx="50" cy="46" r="4" fill="#141110"/>
      <circle cx="550" cy="46" r="10" fill="#E8A317"/>
      <circle cx="550" cy="46" r="4" fill="#141110"/>

      <!-- CLIPS Typography -->
      <text x="300" y="60" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', serif" font-size="44" font-weight="800" fill="url(#goldGrad)" letter-spacing="14" text-anchor="middle">
        CLIPS
      </text>
    </g>

    <!-- Subtitle "STUDIO FOOTAGE &amp; REC.709" -->
    <text x="512" y="880" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="20" font-weight="600" fill="#8C857B" letter-spacing="4" text-anchor="middle">
      BAAWARAY FILMS
    </text>
  </g>
</svg>
