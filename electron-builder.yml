appId: com.baawaray.studio-uploader
productName: Baawaray Films
publish:
  provider: github
  owner: nik2july
  repo: uploader-releases
directories:
  buildResources: build
afterPack: build/afterPack.cjs
files:
  - '!dist/**'
  - '!Backups/**'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/ffprobe-static/**
  - node_modules/ffmpeg-static/**
  - node_modules/sharp/**
  - node_modules/@img/**
win:
  executableName: baawaray-uploader
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSRemovableVolumesUsageDescription: Baawaray Films reads the project folder you select, including folders on external drives and SD cards.
    NSDesktopFolderUsageDescription: Baawaray Films reads the project folder you select.
    NSDocumentsFolderUsageDescription: Baawaray Films reads the project folder you select.
    NSDownloadsFolderUsageDescription: Baawaray Films reads the project folder you select.
    NSCameraUsageDescription: Baawaray Films does not use the camera.
    NSMicrophoneUsageDescription: Baawaray Films does not use the microphone.
  notarize: false
dmg:
  artifactName: Baawaray-Uploader-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: baawaray.com
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
